services:
  app:
    build: ./app
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    restart: always
      
  mysql:
    image: mysql:8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: portfolio
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
      
  phpmyadmin:
    image: phpmyadmin:5.2.2
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
      
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs:/var/log/nginx
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: always
